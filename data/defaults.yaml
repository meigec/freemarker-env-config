# Values shared by every client and environment.
# Merge order: defaults -> client -> environment -> client/environment override.
app:
  name: trade-gateway
  replicas: 1
  featureFlags:
    auditTrail: true
    realtimeRisk: true

db:
  port: 1521
  poolSize: 10

services:
  - name: pricing
    port: 8081
  - name: risk
    port: 8082
